syntax = "proto3";

package users.v1;

import "google/api/annotations.proto";

option go_package = "contracts/gen/go/proto/users/v1;usersv1";

// UsersService предоставляет услуги для управления users.
service UsersService {
  // CreateUser создает нового пользователя.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users"
      body: "*"
    };
  }

  // GetUser возвращает пользователя по его ID.
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {get: "/api/v1/users/{id}"};
  }

  // GetUserByUsername возвращает данные аутентификации пользователя по его имени.
  rpc GetUserAuthDataByUsername(GetUserAuthDataByUsernameRequest) returns (GetUserAuthDataByUsernameResponse);

  // GetUserAuthDataByID возвращает данные аутентификации пользователя по его ID.
  rpc GetUserAuthDataByID(GetUserAuthDataByIDRequest) returns (GetUserAuthDataByIDResponse);

  // ChangeMyPassword изменяет пароль пользователя.
  rpc ChangeMyPassword(ChangeMyPasswordRequest) returns (ChangeMyPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/me/change-password"
      body: "*"
    };
  }

  // AdminChangePassword изменяет пароль пользователя администратором.
  rpc AdminChangePassword(AdminChangePasswordRequest) returns (AdminChangePasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{id}/change-password"
      body: "*"
    };
  }

  // ChangeRole изменяет роль пользователя.
  rpc ChangeRole(ChangeRoleRequest) returns (ChangeRoleResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{id}/role"
      body: "*"
    };
  }

  // AssignPermission присваивает разрешение пользователю.
  rpc AssignPermission(AssignPermissionRequest) returns (AssignPermissionResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{id}/permissions/assign"
      body: "*"
    };
  }

  // RevokePermission отзывает разрешение пользователю.
  rpc RevokePermission(RevokePermissionRequest) returns (RevokePermissionResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{id}/permissions/revoke"
      body: "*"
    };
  }

  // UpdateProfile обновляет профиль пользователя.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      put: "/api/v1/users/{id}/profile"
      body: "*"
    };
  }

  // DeleteUser удаляет пользователя по его ID.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {delete: "/api/v1/users/{id}"};
  }

  // ActivateUser активирует пользователя по его ID.
  rpc ActivateUser(ActivateUserRequest) returns (ActivateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{id}/activate"
      body: "*"
    };
  }

  // DeactivateUser деактивирует пользователя по его ID.
  rpc DeactivateUser(DeactivateUserRequest) returns (DeactivateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{id}/deactivate"
      body: "*"
    };
  }

  // BanUser блокирует пользователя по его ID.
  rpc BanUser(BanUserRequest) returns (BanUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{id}/ban"
      body: "*"
    };
  }

  // UnbanUser разблокирует пользователя по его ID.
  rpc UnbanUser(UnbanUserRequest) returns (UnbanUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{id}/unban"
      body: "*"
    };
  }

  // ListUsers возвращает список всех пользователей.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/api/v1/users"};
  }
}

// Role определяет роль пользователя.
enum Role {
  // ROLE_UNSPECIFIED указывает на неопределенную роль.
  ROLE_UNSPECIFIED = 0;
  // ROLE_STUDENT указывает на роль студента.
  ROLE_STUDENT = 1;
  // ROLE_TEACHER указывает на роль преподавателя.
  ROLE_TEACHER = 2;
  // ROLE_ADMIN указывает на роль администратора.
  ROLE_ADMIN = 3;
}

// PermissionCode определяет код для прав.
enum PermissionCode {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_USERS_READ = 1;
  PERMISSION_USERS_CREATE = 2;
  PERMISSION_USERS_UPDATE = 3;
  PERMISSION_USERS_BAN = 4;
  PERMISSION_USERS_ACTIVATE = 5;
  PERMISSION_USERS_CHANGE_ROLE = 6;
  PERMISSION_USERS_ASSIGN_PERMISSION = 7;
}

// Permission определяет права пользователя.
message Permission {
  string id = 1;
  // code код разрешения.
  PermissionCode code = 2;
  // name название разрешения.
  string name = 3;
}

// User определяет пользователя.
message User {
  string id = 1;
  string username = 2;
  Role role = 3;
  bool is_active = 4;
  bool is_banned = 5;
  string ban_reason = 6;
  string created_at = 7;
  string updated_at = 8;
  repeated Permission permissions = 9;
}

// UserAuthData определяет данные аутентификации пользователя.
message UserAuthData {
  string id = 1;
  string username = 2;
  string password_hash = 3;
  Role role = 4;
  bool is_active = 5;
  bool is_banned = 6;
  string ban_reason = 7;
  repeated PermissionCode permissions = 8;
}

// CreateUserRequest определяет запрос на создание пользователя.
message CreateUserRequest {
  string username = 1;
  string password = 2;
  Role role = 3;
  bool is_active = 4;
  repeated PermissionCode permission_codes = 5;
}

// CreateUserResponse определяет ответ на запрос на создание пользователя.
message CreateUserResponse {
  User user = 1;
}

// GetUserRequest определяет запрос на получение пользователя.
message GetUserRequest {
  string id = 1;
}

// GetUserAuthDataByIDRequest определяет запрос на получение данных аутентификации пользователя по его ID.
message GetUserAuthDataByIDRequest {
  string id = 1;
}

// GetUserAuthDataByIDResponse определяет ответ на запрос на получение данных аутентификации пользователя по его ID.
message GetUserAuthDataByIDResponse {
  UserAuthData user = 1;
}

// GetUserAuthDataByUsernameRequest определяет запрос на получение данных аутентификации пользователя по его имени.
message GetUserAuthDataByUsernameRequest {
  string username = 1;
}

// GetUserAuthDataByUsernameResponse определяет ответ на запрос на получение данных аутентификации пользователя по его имени.
message GetUserAuthDataByUsernameResponse {
  UserAuthData user = 1;
}

// GetUserResponse определяет ответ на запрос на получение пользователя.
message GetUserResponse {
  User user = 1;
}

// ChangeMyPasswordRequest определяет запрос на изменение пароля пользователя.
message ChangeMyPasswordRequest {
  string id = 1;
  string old_password = 2;
  string new_password = 3;
}

// ChangeMyPasswordResponse определяет ответ на запрос на изменение пароля пользователя.
message ChangeMyPasswordResponse {
  bool success = 1;
}

// AdminChangePasswordRequest определяет запрос на изменение пароля администратора.
message AdminChangePasswordRequest {
  string id = 1;
  string new_password = 2;
}

// AdminChangePasswordResponse определяет ответ на запрос на изменение пароля администратора.
message AdminChangePasswordResponse {
  bool success = 1;
}

// ChangeRoleRequest определяет запрос на изменение роли пользователя.
message ChangeRoleRequest {
  string id = 1;
  Role role = 2;
}

// ChangeRoleResponse определяет ответ на запрос на изменение роли пользователя.
message ChangeRoleResponse {
  bool success = 1;
}

// AssignPermissionRequest определяет запрос на назначение прав пользователю.
message AssignPermissionRequest {
  string id = 1;
  PermissionCode permission = 2;
}

// AssignPermissionResponse определяет ответ на запрос на назначение прав пользователю.
message AssignPermissionResponse {
  bool success = 1;
}

// RevokePermissionRequest определяет запрос на отзыв прав пользователю.
message RevokePermissionRequest {
  string id = 1;
  PermissionCode permission = 2;
}

// RevokePermissionResponse определяет ответ на запрос на отзыв прав пользователю.
message RevokePermissionResponse {
  bool success = 1;
}

// UpdateProfileRequest определяет запрос на обновление профиля пользователя.
message UpdateProfileRequest {
  string id = 1;
  string username = 2;
}

// UpdateProfileResponse определяет ответ на запрос на обновление профиля пользователя.
message UpdateProfileResponse {
  bool success = 1;
}

// DeleteUserRequest определяет запрос на удаление пользователя.
message DeleteUserRequest {
  string id = 1;
}

// DeleteUserResponse определяет ответ на запрос на удаление пользователя.
message DeleteUserResponse {
  bool success = 1;
}

// ActivateUserRequest определяет запрос на активацию пользователя.
message ActivateUserRequest {
  string id = 1;
}

// ActivateUserResponse определяет ответ на запрос на активацию пользователя.
message ActivateUserResponse {
  bool success = 1;
}

// DeactivateUserRequest определяет запрос на деактивацию пользователя.
message DeactivateUserRequest {
  string id = 1;
}

// DeactivateUserResponse определяет ответ на запрос на деактивацию пользователя.
message DeactivateUserResponse {
  bool success = 1;
}

// BanUserRequest определяет запрос на блокирование пользователя.
message BanUserRequest {
  string id = 1;
  string reason = 2;
}

// UnbanUserRequest определяет запрос на разблокирование пользователя.
message UnbanUserRequest {
  string id = 1;
}

// UnbanUserResponse определяет ответ на запрос на разблокирование пользователя.
message UnbanUserResponse {
  bool success = 1;
}

// BanUserResponse определяет ответ на запрос на блокирование пользователя.
message BanUserResponse {
  bool success = 1;
}

// ListUsersRequest определяет запрос на получение списка пользователей.
message ListUsersRequest {
  int32 limit = 1;
  int32 offset = 2;
  Role role = 3;
  bool only_active = 4;
}

// ListUsersResponse определяет ответ на запрос на получение списка пользователей.
message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}
