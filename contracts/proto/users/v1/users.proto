syntax = "proto3";

package users.v1;

option go_package = "contracts/gen/go/proto/users/v1;usersv1";

import "google/api/annotations.proto";

message User {
    string id = 1;
    string username = 2;
    string email = 3;
    string role = 4;
    bool is_active = 5;
    string created_at = 6;
    string updated_at = 7;
}
