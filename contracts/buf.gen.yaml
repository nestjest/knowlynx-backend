version: v2
clean: true
managed:
  enabled: true

plugins:
  - local: protoc-gen-go
    out: gen/go/proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go/proto
    opt: paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: gen/go/proto
    opt: paths=source_relative
  - local:
      - go
      - run
      - github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2
    out: gen/swagger

inputs:
  - directory: proto
    paths:
      - proto/auth/v1
      - proto/users/v1
