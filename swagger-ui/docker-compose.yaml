services:
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-ui
    ports:
      - "8080:8080"
    environment:
      URLS: |
        [
          {"url": "/swagger/auth/v1/auth.swagger.json", "name": "Auth API"},
          {"url": "/swagger/users/v1/users.swagger.json", "name": "Users API"}
        ]
    volumes:
      - ../contracts/gen/swagger:/usr/share/nginx/html/swagger:ro
